# OP-TEE's driver and the SBI MPXY mailbox it calls OP-TEE through. RISC-V's
# defconfig has TEE and OPTEE, but they depend on RISCV_SBI_MPXY_MBOX, in
# the mailbox menu, which only something else selecting MAILBOX opens: on
# RV64, ACPI's CPPC library; on RV32, without ACPI, nothing.
CONFIG_MAILBOX=y
CONFIG_RISCV_SBI_MPXY_MBOX=y
CONFIG_TEE=y
CONFIG_OPTEE=y
